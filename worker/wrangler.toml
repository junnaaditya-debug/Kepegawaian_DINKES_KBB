name = "simpeg-dinkes-kbb-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Setelah menjalankan `wrangler d1 create simpeg-db`, salin database_id yang
# ditampilkan ke sini.
[[d1_databases]]
binding = "DB"
database_name = "simpeg-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

# Setelah menjalankan `wrangler r2 bucket create simpeg-dokumen`, binding ini
# akan otomatis terhubung (tidak perlu ID tambahan).
[[r2_buckets]]
binding = "DOKUMEN_BUCKET"
bucket_name = "simpeg-dokumen"

# FR-5.1: job reminder kenaikan pangkat berjalan setiap hari jam 06:00 WIB (23:00 UTC).
[triggers]
crons = ["0 23 * * *"]

[vars]
JWT_EXPIRES_IN_SECONDS = "28800"
CLIENT_ORIGIN = "http://localhost:5173"

# Secrets (JANGAN taruh nilai asli di sini) — set lewat:
#   wrangler secret put JWT_SECRET
