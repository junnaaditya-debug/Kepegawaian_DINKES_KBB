name: Deploy SIMPEG-DINKES KBB to Cloudflare

# Manual deploy: Actions tab -> "Deploy SIMPEG-DINKES KBB to Cloudflare" -> Run workflow.
# Runs on GitHub's infrastructure, so it is not affected by any network
# restrictions of the machine/session that authored this repo.
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy-worker:
    name: Deploy API (Cloudflare Workers + D1 + R2)
    runs-on: ubuntu-latest
    outputs:
      worker-url: ${{ steps.deploy.outputs.worker_url }}
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci

      - name: Bootstrap D1 database + R2 bucket (idempotent, creates on first run only)
        id: bootstrap
        run: |
          set -e
          FIND_ID='import json,sys; dbs=json.load(sys.stdin); m=[d for d in dbs if d.get("name")=="simpeg-dinkes-kbb-db"]; print(m[0]["uuid"] if m else "")'
          DB_ID=$(npx wrangler d1 list --json | python3 -c "$FIND_ID")
          if [ -z "$DB_ID" ]; then
            echo "Creating D1 database simpeg-dinkes-kbb-db..."
            npx wrangler d1 create simpeg-dinkes-kbb-db
            DB_ID=$(npx wrangler d1 list --json | python3 -c "$FIND_ID")
          fi
          echo "Using D1 database_id=$DB_ID"
          sed -i "s/REPLACE_WITH_D1_DATABASE_ID/$DB_ID/" wrangler.toml

          if ! npx wrangler r2 bucket list | grep -q "simpeg-dinkes-kbb-docs"; then
            echo "Creating R2 bucket simpeg-dinkes-kbb-docs..."
            npx wrangler r2 bucket create simpeg-dinkes-kbb-docs
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply simpeg-dinkes-kbb-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set JWT_SECRET
        run: echo "${{ secrets.JWT_SECRET }}" | npx wrangler secret put JWT_SECRET
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        id: deploy
        run: |
          OUTPUT=$(npx wrangler deploy)
          echo "$OUTPUT"
          URL=$(echo "$OUTPUT" | grep -Eo 'https://[a-zA-Z0-9.-]+\.workers\.dev' | head -n1)
          echo "worker_url=$URL" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-web:
    name: Deploy Frontend (Cloudflare Pages)
    needs: deploy-worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ needs.deploy-worker.outputs.worker-url }}

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name=simpeg-dinkes-kbb --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Summary
        run: |
          echo "### Deploy selesai" >> "$GITHUB_STEP_SUMMARY"
          echo "- API: ${{ needs.deploy-worker.outputs.worker-url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Frontend: https://simpeg-dinkes-kbb.pages.dev" >> "$GITHUB_STEP_SUMMARY"
